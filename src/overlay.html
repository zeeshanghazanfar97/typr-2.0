<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body data-state="ready">
    <main id="overlay-shell" class="overlay-shell" aria-label="Typr floating controls">
      <button id="collapsed-handle" class="collapsed-handle" type="button" aria-label="Show Typr dock">
        <span></span>
      </button>

      <section id="control-stack" class="control-stack" aria-label="Typr dock">
        <div id="transform-popover" class="transform-popover" aria-label="Transforms">
          <button id="auto-apply-toggle" class="popover-row popover-row-toggle" type="button" data-hov aria-pressed="true">
            <span>Auto Apply After Dictation</span>
            <span class="switch" aria-hidden="true"><span></span></span>
          </button>

          <div class="popover-divider"></div>

          <div id="transform-options" class="transform-options-list"></div>

          <div class="popover-divider"></div>

          <button id="configure-transforms" class="popover-row configure-row" type="button" data-hov>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.8l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4A2 2 0 0 0 20 14l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.8l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Configure transforms</span>
          </button>
        </div>

        <div id="hover-label" class="hover-label" role="status" aria-live="polite"></div>

        <div class="control-row">
          <button id="dictate-button" class="dock-button dictate-button" type="button" data-hov data-tip="dictate" aria-label="Dictate">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2.5" width="6" height="11.5" rx="3" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5" />
            </svg>
          </button>

          <div id="transform-control" class="transform-control">
            <button id="transform-button" class="transform-icon" type="button" data-hov data-tip="transform" aria-label="Transforms">
              <span id="transform-button-icon" class="transform-button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4.5 19.5 13 11" />
                <path d="m15.5 3.5 1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1 1-2.3Z" />
                <path d="m19.8 11.5.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7.7-1.5Z" />
              </svg>
              </span>
            </button>
            <button id="transform-caret" class="transform-caret" type="button" data-hov data-tip="caret" aria-label="Open transforms menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6.5 14.5 5.5-5.5 5.5 5.5" />
              </svg>
            </button>
          </div>

          <button id="notes-button" class="dock-button notes-button" type="button" data-hov data-tip="notes" aria-label="Notes">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7.6l-5.5 5.4H6.5a2 2 0 0 1-2-2v-11Z" />
              <path d="M14 19.5V16a2 2 0 0 1 2-2h3.5M8.5 9h7M8.5 12.5H12" />
            </svg>
          </button>
        </div>
      </section>

      <section class="status-stack" aria-live="polite">
        <div class="recording-pill">
          <span class="recording-dot" aria-hidden="true"></span>
          <span id="recording-timer" class="recording-timer">0:00</span>
          <div id="waveform" class="waveform" aria-hidden="true"></div>
          <span class="status-divider" aria-hidden="true"></span>
          <button id="cancel-recording" class="status-action subtle" type="button" data-hov aria-label="Cancel recording">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18M18 6 6 18" />
            </svg>
          </button>
          <button id="stop-recording" class="status-action stop" type="button" data-hov aria-label="Stop recording">
            <span></span>
          </button>
        </div>

        <div class="processing-pill transcribing-pill">
          <span class="dot-loader" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span>Transcribing</span>
        </div>

        <div class="processing-pill polishing-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 19.5 13 11" />
            <path d="m15.5 3.5 1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1 1-2.3Z" />
            <path d="m19.8 11.5.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7.7-1.5Z" />
          </svg>
          <span id="polishing-label">Polishing</span>
        </div>

        <div class="processing-pill inserted-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5 9.5 17 19 7" />
          </svg>
          <span>Inserted</span>
        </div>

        <div class="processing-pill polished-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5 9.5 17 19 7" />
          </svg>
          <span id="polished-label">Polished</span>
        </div>

        <div class="processing-pill canceled-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6 18 18M18 6 6 18" />
          </svg>
          <span>Dictation cancelled</span>
        </div>
      </section>
    </main>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
